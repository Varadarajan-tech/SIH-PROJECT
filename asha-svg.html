<!-- TEMPLE SKYLINE (decorative background strip) -->
<svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <g fill="#0b3d7a" opacity="0.85">
    <!-- gopuram (South Indian temple tower) -->
    <g transform="translate(60,0)">
      <rect x="20" y="170" width="120" height="70"/>
      <rect x="34" y="130" width="92" height="44"/>
      <rect x="46" y="96" width="68" height="38"/>
      <path d="M50 96 L80 40 L110 96 Z"/>
      <circle cx="80" cy="34" r="7"/>
    </g>
    <!-- shikhara (North Indian curved spire) -->
    <g transform="translate(300,0)">
      <rect x="10" y="180" width="140" height="60"/>
      <path d="M20 180 C30 120 60 110 80 40 C100 110 130 120 140 180 Z"/>
      <circle cx="80" cy="34" r="6"/>
      <rect x="36" y="150" width="88" height="30" fill="#f2f5f9" opacity=".18"/>
    </g>
    <!-- stupa -->
    <g transform="translate(560,0)">
      <path d="M20 240 C20 150 50 130 80 96 C110 130 140 150 140 240 Z"/>
      <rect x="74" y="70" width="12" height="30"/>
      <circle cx="80" cy="64" r="9"/>
      <rect x="0" y="228" width="160" height="12"/>
    </g>
    <!-- ashoka pillar fragment -->
    <g transform="translate(800,0)">
      <rect x="30" y="120" width="26" height="120"/>
      <rect x="18" y="108" width="50" height="16" rx="6"/>
      <circle cx="43" cy="88" r="22" opacity=".9"/>
      <circle cx="43" cy="88" r="15" fill="#f2f5f9" opacity=".3"/>
    </g>
    <!-- second gopuram, smaller -->
    <g transform="translate(960,0)">
      <rect x="14" y="186" width="92" height="54"/>
      <rect x="26" y="152" width="68" height="38"/>
      <path d="M30 152 L60 106 L90 152 Z"/>
      <circle cx="60" cy="100" r="6"/>
    </g>
  </g>
</svg>
